<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HedgeHog Trade Coordinator</title>
  <style>
    :root { --ink: #1d2524; --muted: #66716e; --paper: #f6f3ed; --line: #d9ddd5; --coral: #d35f45; --teal: #176b67; --mint: #dcece4; }
    * { box-sizing: border-box; }
    body { margin: 0; background: radial-gradient(circle at 12% 0%, #fffaf0 0, transparent 34%), var(--paper); color: var(--ink); font: 16px/1.5 Georgia, serif; }
    header, main { width: min(1120px, calc(100% - 40px)); margin: auto; }
    header { padding: 42px 0 30px; display: flex; justify-content: space-between; gap: 24px; align-items: end; border-bottom: 1px solid var(--line); }
    .eyebrow { color: var(--coral); font: 700 12px/1.2 system-ui, sans-serif; letter-spacing: 0; text-transform: uppercase; }
    h1 { font-size: clamp(2rem, 5vw, 4.5rem); line-height: 0.98; font-weight: 400; margin: 8px 0 0; max-width: 680px; }
    .run { color: var(--muted); font: 13px system-ui, sans-serif; white-space: nowrap; }
    main { padding: 32px 0 70px; }
    .bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
    h2 { font-size: 1.35rem; font-weight: 400; margin: 0; }
    .count { color: var(--teal); font: 700 13px system-ui, sans-serif; }
    .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    article { background: #fffdf8; border: 1px solid var(--line); border-top: 5px solid var(--teal); padding: 22px; min-height: 340px; box-shadow: 0 12px 30px #32433d0d; }
    article.blocked { border-top-color: var(--coral); }
    .card-head { display: flex; justify-content: space-between; gap: 12px; align-items: start; }
    h3 { margin: 0; font-size: 1.45rem; font-weight: 400; line-height: 1.1; }
    .badge { color: var(--teal); background: var(--mint); padding: 4px 8px; font: 700 11px system-ui, sans-serif; }
    .blocked .badge { color: #963d2e; background: #f7ded6; }
    .id { color: var(--muted); font: 11px system-ui, sans-serif; margin: 14px 0 20px; }
    dl { display: grid; grid-template-columns: 82px 1fr; gap: 8px 12px; margin: 0; }
    dt { color: var(--muted); font: 700 11px system-ui, sans-serif; text-transform: uppercase; }
    dd { margin: 0; }
    .actions { display: flex; gap: 8px; margin-top: 24px; }
    button { border: 1px solid var(--ink); background: transparent; color: var(--ink); padding: 8px 11px; cursor: pointer; font: 700 12px system-ui, sans-serif; }
    button:hover, button:focus { background: var(--ink); color: #fffdf8; }
    .empty { color: var(--muted); border-left: 3px solid var(--coral); padding: 18px; background: #fffdf8; }
    @media (max-width: 780px) { header { display: block; } .run { display: block; margin-top: 16px; } .cards { grid-template-columns: 1fr; } article { min-height: 0; } }
  </style>
  <link rel="stylesheet" href="/ui/components.css">
</head>
<body>
  <header>
    <div><div class="eyebrow">Meeting surface</div><h1>Decisions worth carrying forward.</h1></div>
    <div class="run" id="run">Connecting to Coordinator...</div>
  </header>
  <main>
    <div class="bar"><h2>Priority candidates</h2><span class="count" id="count"></span></div>
    <candidate-shelves aria-live="polite"></candidate-shelves>
    <audit-panel hidden></audit-panel>
  </main>
  <script type="module" src="/ui/components.js"></script>
</body>
</html>
